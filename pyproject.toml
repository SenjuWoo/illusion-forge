[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "illusionforge"
version = "1.0.0"
description = "Local workbench for Honey Select 2 and Koikatsu character cards and the in-game maker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["kkloader>=0.1.24", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/SenjuWoo/illusion-forge"
Changelog = "https://github.com/SenjuWoo/illusion-forge/blob/main/CHANGELOG.md"
Issues = "https://github.com/SenjuWoo/illusion-forge/issues"

[project.scripts]
illusionforge = "illusionforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
illusionforge = ["data/*.json"]
